# Cores: azul 212° (o do GitHub) nos quadrados, roxo 252° (análogo) na cobra.
name: Animação de contribuições

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03:00 de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5739D0&color_dots=#ebedf0,#b6d4f5,#6fa8ec,#2f7ee0,#0969DA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A18CF8&color_dots=#151b23,#163a63,#1f5aa3,#3277d6,#4493F8

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
