name: Animação de contribuições

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03:00 de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6231C4&color_dots=#ebedf0,#d9cdf6,#b49cec,#8a69dc,#6231C4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#B797F7&color_dots=#161b22,#33275a,#553d9e,#8466d6,#B797F7

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
